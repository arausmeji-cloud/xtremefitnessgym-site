<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BJJ Gallery | Xtreme Fitness Gym</title>

    <!-- CSS NUEVO -->
    <link rel="stylesheet" href="css/main-v2.css">
</head>

<body>

<header class="gallery-page-header">
    <h1>BJJ Gallery</h1>
    <p>Brazilian Jiu-Jitsu — Confidence, discipline & self-defence.</p>
    <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
</header>

<section class="gallery-photos">
    <div class="gallery-grid">

        <!-- Imágenes correctas con THUMBNAIL -->
        <img src="images/gallery/bjj/bjj-1.jpg" class="gallery-thumb">
        <img src="images/gallery/bjj/bjj-2.jpg" class="gallery-thumb">
        <img src="images/gallery/bjj/bjj-3.jpg" class="gallery-thumb">
        <img src="images/gallery/bjj/bjj-4.jpg" class="gallery-thumb">
        <img src="images/gallery/bjj/bjj-5.jpg" class="gallery-thumb">
        <img src="images/gallery/bjj/bjj-6.jpg" class="gallery-thumb">
        <img src="images/gallery/bjj/bjj-7.jpg" class="gallery-thumb">

    </div>
</section>

<footer class="footer">
    <div class="footer-inner">
        <p>© 2025 Xtreme Fitness Gym</p>
        <p class="footer-tagline">No excuses. Just results.</p>
    </div>
</footer>

<!-- ============= LIGHTBOX ============= -->
<div id="lightbox">
    <button class="nav-btn prev-btn" id="prev-btn">&#10094;</button>
    <img src="">
    <button class="nav-btn next-btn" id="next-btn">&#10095;</button>
</div>

<!-- ============= SCRIPT ============== -->
<script>
    const images = Array.from(document.querySelectorAll(".gallery-thumb"));
    let currentIndex = 0;

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = lightbox.querySelector("img");

    images.forEach((img, index) => {
        img.addEventListener("click", () => {
            currentIndex = index;
            showImage();
            lightbox.style.display = "flex";
        });
    });

    function showImage() {
        lightboxImg.src = images[currentIndex].src;
    }

    document.getElementById("next-btn").addEventListener("click", (event) => {
        event.stopPropagation();
        currentIndex = (currentIndex + 1) % images.length;
        showImage();
    });

    document.getElementById("prev-btn").addEventListener("click", (event) => {
        event.stopPropagation();
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        showImage();
    });

    lightbox.addEventListener("click", () => {
        lightbox.style.display = "none";
    });
</script>

<!-- LIGHTBOX -->
<div id="lightbox">
    <button id="prev-btn" class="nav-btn prev-btn">&#10094;</button>
    <img src="" alt="Expanded Image">
    <button id="next-btn" class="nav-btn next-btn">&#10095;</button>
</div>

</div>
</body>
</html>
