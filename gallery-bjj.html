<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJJ Gallery | Xtreme Fitness Gym</title>
  <link rel="stylesheet" href="css/main-v2.css">
</head>

<body>

<header class="gallery-page-header">
  <h1>BJJ GALLERY</h1>
  <p>Brazilian Jiu-Jitsu – confidence, discipline & self-defence.</p>
  <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
</header>

<section id="gallery" class="gallery-section">
  <h2>BJJ Gallery</h2>
  <div class="gallery-grid" id="bjj-container"></div>
</section>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="prev-btn" class="nav-btn">&#10094;</button>
  <img id="lightbox-img" class="lightbox-img" src="" alt="">
  <button id="next-btn" class="nav-btn">&#10095;</button>
</div>

<script>
// AUTO LOAD BJJ IMAGES
const container = document.getElementById("bjj-container");
let images = [];
const totalImages = 20; // cantidad máxima por si mañana subís más

for (let i = 1; i <= totalImages; i++) {
  const path = images/gallery/bjj/bjj-${i}.jpg;
  images.push(path);

  const img = new Image();
  img.src = path;

  img.onload = () => {
    const thumb = document.createElement("img");
    thumb.src = path;
    thumb.classList.add("gallery-thumb");
    thumb.alt = BJJ Photo ${i};
    container.appendChild(thumb);
  };
}

// LIGHTBOX
let currentIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightImg = document.getElementById('lightbox-img');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

container.addEventListener('click', (e) => {
  if (e.target.classList.contains('gallery-thumb')) {
    const src = e.target.src;
    currentIndex = images.indexOf(src.replace(window.location.origin + "/", ""));
    lightImg.src = src;
    lightbox.style.display = 'flex';
  }
});

nextBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % images.length;
  lightImg.src = images[currentIndex];
});

prevBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  lightImg.src = images[currentIndex];
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});
</script>

</body>
</html>
