<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BJJ Gallery | Xtreme Fitness Gym</title>
    <link rel="stylesheet" href="css/main-v2.css" />
</head>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <button class="close-btn">&times;</button>
  <img class="lightbox-img" src="" alt="">
  <button class="nav-btn prev-btn">&#10094;</button>
  <button class="nav-btn next-btn">&#10095;</button>
</div>

<script>
const images = document.querySelectorAll('.gallery-grid img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-img');
const closeBtn = document.querySelector('.close-btn');
const nextBtn = document.querySelector('.next-btn');
const prevBtn = document.querySelector('.prev-btn');

let currentIndex = 0;

images.forEach((img, index) => {
  img.addEventListener('click', () => {
    currentIndex = index;
    lightboxImg.src = img.src;
    lightbox.style.display = 'flex';
  });
});

closeBtn.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

nextBtn.addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % images.length;
  lightboxImg.src = images[currentIndex].src;
});

prevBtn.addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  lightboxImg.src = images[currentIndex].src;
});
</script>

    
<body>

<header class="gallery-page-header">
    <h1>BJJ Gallery</h1>
    <p>Brazilian Jiu-Jitsu — confidence, discipline & self-defence.</p>
    <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
</header>

<section id="gallery" class="gallery-section">
  <h2>BJJ Gallery</h2>

  <div class="gallery-grid">

    <img src="images/gallery/bjj/bjj-1.jpg" alt="BJJ Photo 1">
    <img src="images/gallery/bjj/bjj-2.jpg" alt="BJJ Photo 2">
    <img src="images/gallery/bjj/bjj-3.jpg" alt="BJJ Photo 3">
    <img src="images/gallery/bjj/bjj-4.jpg" alt="BJJ Photo 4">
    <img src="images/gallery/bjj/bjj-5.jpg" alt="BJJ Photo 5">
    <img src="images/gallery/bjj/bjj-6.jpg" alt="BJJ Photo 6">
    <img src="images/gallery/bjj/bjj-7.jpg" alt="BJJ Photo 7">

  </div>
</section>

<footer class="footer">
    <div class="footer-inner">
        <p>© 2025 Xtreme Fitness Gym</p>
        <p class="footer-tagline">No excuses. Just results.</p>
    </div>
</footer>

</body>
</html>
