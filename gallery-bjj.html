<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJJ Gallery | Xtreme Fitness Gym</title>
  <link rel="stylesheet" href="css/main-v2.css">
</head>

<body>

<header class="gallery-page-header">
  <h1>BJJ GALLERY</h1>
  <p>Brazilian Jiu-Jitsu – confidence, discipline & self-defence.</p>
  <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
</header>

<section id="gallery" class="gallery-section">
  <h2>BJJ Gallery</h2>
  <div class="gallery-grid" id="bjj-container"></div>
</section>

<script>
const totalPhotos = 7;
const container = document.getElementById("bjj-container");

for (let i = 1; i <= totalPhotos; i++) {
    const img = document.createElement("img");
    img.src = `./images/gallery/bjj/bjj-${i}.jpg`;
    img.classList.add("gallery-thumb");
    img.alt = `BJJ Photo ${i}`;
    container.appendChild(img);
}

</script>
  
<!-- LIGHTBOX -->
<div id="lightbox" style="display:none;">
  <button id="prev-btn" class="nav-btn">&#10094;</button>
  <img id="lightbox-img" class="lightbox-img" src="" alt="">
  <button id="next-btn" class="nav-btn">&#10095;</button>
</div>

<script>
// === LIGHTBOX ===
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const prevBtn = document.getElementById("prev-btn");
const nextBtn = document.getElementById("next-btn");

let currentIndex = 0;

// Abrir lightbox al hacer click en una miniatura
container.addEventListener("click", (e) => {
    if (e.target.tagName === "IMG") {
        const src = e.target.src;
        currentIndex = parseInt(src.match(/bjj-(\d+)\.jpg/)[1]) - 1;
        lightboxImg.src = src;
        lightbox.style.display = "flex";
    }
});

// Navegar siguiente
nextBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % totalPhotos;
    lightboxImg.src = `./images/gallery/bjj/bjj-${currentIndex + 1}.jpg`;
});

// Navegar anterior
prevBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + totalPhotos) % totalPhotos;
    lightboxImg.src = `./images/gallery/bjj/bjj-${currentIndex + 1}.jpg`;
});

// Cerrar lightbox al hacer click fuera de la imagen
lightbox.addEventListener("click", () => {
    lightbox.style.display = "none";
});
</script>



</body>
</html>
