<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Gallery | Xtreme Fitness Gym</title>
   <link rel="stylesheet" href="css/main-v2.css" />
</head>

<body>

    <!-- HEADER -->
    <header class="gallery-page-header">
        <h1>GYM GALLERY</h1>
        <p>Strength, machines, racks & the XF training atmosphere.</p>
        <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
    </header>

    <!-- GALERÍA -->
    <section id="gallery" class="gallery-section">
        <h2>GYM Gallery</h2>

       <div class="gallery-grid" id="gym-container"></div>

    </section>

    <!-- LIGHTBOX -->
    <div id="lightbox">
        <button id="prev-btn" class="nav-btn">&#10094;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
        <button id="next-btn" class="nav-btn">&#10095;</button>
    </div>

    <script>
const totalPhotos = 7;  
const container = document.getElementById("gym-container");

for (let i = 1; i <= totalPhotos; i++) {
    const img = document.createElement("img");
    img.src = `./images/gallery/gym/gym-${i}.jpg`;
    img.classList.add("gallery-thumb");
    img.alt = `Gym Photo ${i}`;
    container.appendChild(img);
}
</script>


</body>
</html>
