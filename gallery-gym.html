<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Gallery | Xtreme Fitness Gym</title>
<link rel="stylesheet" href="css/main-v2.css">
</head>
<body>
  
<!-- LIGHTBOX PRO -->
<div id="lightbox">
    <button id="prev-btn" class="nav-btn">&#10094;</button>
    <img id="lightbox-img" class="lightbox-img" src="" alt="">
    <button id="next-btn" class="nav-btn">&#10095;</button>
</div>
  
  <header class="gallery-page-header">
    <h1>Gym Gallery</h1>
    <p>Strength, machines, racks & the XF training atmosphere.</p>
    <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
  </header>

<section id="gallery" class="gallery-section">
    <h2>GYM GALLERY</h2>

 <div class="gallery-grid">
    <img class="gallery-thumb" src="images/gallery/gym/xf-gym-1.png" alt="Gym Photo 1">
    <img class="gallery-thumb" src="images/gallery/gym/xf-gym-2.png" alt="Gym Photo 2">
    <img class="gallery-thumb" src="images/gallery/gym/xf-gym-3.png" alt="Gym Photo 3">
    <img class="gallery-thumb" src="images/gallery/gym/xf-gym-4.png" alt="Gym Photo 4">
    <img class="gallery-thumb" src="images/gallery/gym/xf-gym-5.png" alt="Gym Photo 5">
   <img class="gallery-thumb" src="images/gallery/gym/xf-gym-6.jpg" alt="Gym Photo 6">
<img class="gallery-thumb" src="images/gallery/gym/xf-gym-7.jpg" alt="Gym Photo 7">
</div>
  
</section>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2025 Xtreme Fitness Gym</p>
      <p class="footer-tagline">No excuses. Just results.</p>
    </div>
  </footer>

<!-- LIGHTBOX PRO -->
<div id="lightbox">
    <button id="prev-btn" class="nav-btn">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="next-btn" class="nav-btn">&#10095;</button>
</div>

<script>
const thumbs = document.querySelectorAll('.gallery-thumb');
const lightbox = document.getElementById('lightbox');
const lightImg = document.getElementById('lightbox-img');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

let currentIndex = 0;

// Abrir lightbox
thumbs.forEach((img, index) => {
    img.addEventListener('click', () => {
        currentIndex = index;
        lightImg.src = img.src;
        lightbox.style.display = 'flex';
    });
});

// Botón siguiente
nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % thumbs.length;
    lightImg.src = thumbs[currentIndex].src;
});

// Botón anterior
prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + thumbs.length) % thumbs.length;
    lightImg.src = thumbs[currentIndex].src;
});

// Cerrar lightbox al hacer click afuera
lightbox.addEventListener('click', () => {
    lightbox.style.display = 'none';
});
</script>

</body>
</html>
