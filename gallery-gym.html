<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Gallery | Xtreme Fitness Gym</title>
    <link rel="stylesheet" href="css/main.v2.css" />
</head>

<body>

    <!-- HEADER -->
    <header class="gallery-page-header">
        <h1>GYM GALLERY</h1>
        <p>Strength, machines, racks & the XF training atmosphere.</p>
        <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
    </header>

    <!-- GALERÍA -->
    <section id="gallery" class="gallery-section">
        <h2>GYM Gallery</h2>

        <div class="gallery-grid" id="gym-grid">
            <!-- Las imágenes se insertan automáticamente -->
        </div>
    </section>

    <!-- LIGHTBOX -->
    <div id="lightbox">
        <button id="prev-btn" class="nav-btn">&#10094;</button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="">
        <button id="next-btn" class="nav-btn">&#10095;</button>
    </div>

    <!-- SCRIPT -->
    <script>
        // Cantidad de imágenes en la carpeta gym
        const totalImages = 7;

        // Contenedor donde se insertan los thumbnails
        const grid = document.getElementById("gym-grid");

        // Insertamos las imágenes automáticamente
        for (let i = 1; i <= totalImages; i++) {
            const img = document.createElement("img");
            img.src = images/gallery/gym/gym-${i}.jpg;
            img.alt = Gym Photo ${i};
            img.classList.add("gallery-thumb");
            grid.appendChild(img);
        }

        // Lógica del Lightbox
        const thumbs = document.querySelectorAll(".gallery-thumb");
        const lightbox = document.getElementById("lightbox");
        const lightImg = document.getElementById("lightbox-img");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");

        let currentIndex = 0;

        thumbs.forEach((img, index) => {
            img.addEventListener("click", () => {
                currentIndex = index;
                lightImg.src = img.src;
                lightbox.style.display = "flex";
            });
        });

        nextBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % thumbs.length;
            lightImg.src = thumbs[currentIndex].src;
        });

        prevBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + thumbs.length) % thumbs.length;
            lightImg.src = thumbs[currentIndex].src;
        });

        lightbox.addEventListener("click", () => {
            lightbox.style.display = "none";
        });
    </script>

</body>
</html>
