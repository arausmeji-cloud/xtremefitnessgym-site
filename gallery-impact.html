<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impact Gallery | Xtreme Fitness Gym</title>
  <link rel="stylesheet" href="css/main-v2.css">
</head>
<body>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="prev-btn" class="nav-btn">&#10094;</button>
  <img id="lightbox-img" class="lightbox-img" src="">
  <button id="next-btn" class="nav-btn">&#10095;</button>
</div>

<header class="gallery-page-header">
  <h1>XF IMPACT</h1>
  <p>Community, mindset, motivation & transformation.</p>
  <a href="index.html#gallery" class="back-link">← Back to main gallery</a>
</header>

<section class="gallery-section">
  <h2>Impact Gallery</h2>

 <div class="gallery-grid">
    <img class="gallery-thumb" src="images/gallery/impact/abs black.jpg" alt="Impact Photo 1">
    <img class="gallery-thumb" src="images/gallery/impact/cable cross over black.jpg" alt="Impact Photo 2">
    <img class="gallery-thumb" src="images/gallery/impact/chin up grey.jpg" alt="Impact Photo 3">
    <img class="gallery-thumb" src="images/gallery/impact/cross fit black and white.jpg" alt="Impact Photo 4">
    <img class="gallery-thumb" src="images/gallery/impact/dumbells black.jpg" alt="Impact Photo 5">
    <img class="gallery-thumb" src="images/gallery/impact/gym purple.jpg" alt="Impact Photo 6">
    <img class="gallery-thumb" src="images/gallery/impact/gym white.jpg" alt="Impact Photo 7">
</div>
</section>

<footer class="footer">
  <div class="footer-inner">
    <p>© 2025 Xtreme Fitness Gym</p>
    <p class="footer-tagline">No excuses. Just results.</p>
  </div>
</footer>

<script>
const thumbs = document.querySelectorAll('.gallery-thumb');
const lightbox = document.getElementById('lightbox');
const lightImg = document.getElementById('lightbox-img');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

let currentIndex = 0;

thumbs.forEach((img, index) => {
  img.addEventListener('click', () => {
    currentIndex = index;
    lightImg.src = img.src;
    lightbox.style.display = 'flex';
  });
});

nextBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex + 1) % thumbs.length;
  lightImg.src = thumbs[currentIndex].src;
});

prevBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  currentIndex = (currentIndex - 1 + thumbs.length) % thumbs.length;
  lightImg.src = thumbs[currentIndex].src;
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});
</script>

</body>
</html>
